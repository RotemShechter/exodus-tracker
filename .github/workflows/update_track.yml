name: Update Track Data

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Fetch Script
        run: python fetch_track.py

      - name: Inject API Key
        run: |
          # This swaps the placeholder in your HTML with the secret from GitHub's vault
          sed -i "s/{{WINDY_KEY}}/${{ secrets.WINDY_API_KEY }}/g" index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # We add both the newly generated JSON and the modified HTML
          git add track.json index.html
          
          # Only commit if something actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update and key injection" && git push)
