name: Update Track Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# This tells GitHub to use the new Node 24 engine, silencing the warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Fetch Script
        run: python fetch_track.py

      - name: Commit track.json to source
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add track.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated track update" && git push)

      - name: Prepare Deployment Artifact
        run: |
          mkdir _site
          cp index.html track.json _site/
          sed -i "s/{{WINDY_KEY}}/${{ secrets.WINDY_API_KEY }}/g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'
          retention-days: 1

  deploy:
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
