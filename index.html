<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exodus Live Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    
    <style>
        /* 1. Base Map Locking */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; overscroll-behavior: none;
            font-family: 'Inter', sans-serif; background: #0a0e1a;
        }
        #windy { position: absolute; inset: 0; width: 100%; height: 100%; }
        
        /* 2. Map Marker Styles */
        .leaflet-div-icon { background: transparent; border: none; }
        .mobile-scale { transform: scale(1.4); transform-origin: center; }

        /* 3. Floating Glass Dashboards Container */
        :root {
            --bg-card: rgba(26, 28, 35, 0.88);
            --bg-card-border: #444c56;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --text-primary: #e6edf3;
            --text-muted: #8b949e;
        }

        #dash-container {
            position: absolute;
            top: 15px; left: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            transition: all 0.3s ease;
        }

        #dashboard, #weather-dashboard {
            position: relative; 
            width: 300px;
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .dash-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: rgba(88, 166, 255, 0.08);
            border-bottom: 1px solid var(--bg-card-border);
            cursor: pointer; user-select: none;
        }
        .dash-header:hover { background: rgba(88, 166, 255, 0.12); }

        .dash-collapse-btn { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .dash-chevron {
            font-style: normal; font-size: 14px; color: var(--text-muted);
            transition: transform 0.25s ease; line-height: 1;
        }
        .dash-header:hover .dash-chevron { color: var(--accent); }
        #dashboard.collapsed .dash-chevron { transform: rotate(180deg); }

        .vessel-icon { font-size: 22px; filter: drop-shadow(0 0 4px rgba(88,166,255,0.4)); }
        .vessel-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
        .vessel-sub { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* Pulsing Status Dot */
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite; flex-shrink: 0;
        }
        .status-dot.stale { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 3s infinite;}
        .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        /* Dashboard Body & Data Rows */
        .dash-body {
            padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
            overflow: hidden; max-height: 500px;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }
        #dashboard.collapsed .dash-body { max-height: 0; padding-top: 0; padding-bottom: 0; border: none; }

        .data-row { display: flex; flex-direction: column; gap: 2px; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
        
        .data-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px;
        }
        .data-value {
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            color: var(--text-primary); font-weight: 500;
        }
        .data-value.accent { color: var(--accent); }
        .data-value.green { color: var(--success); }

        /* Mobile specific scaling */
        @media (max-width: 480px) {
            #dash-container { 
                top: 10px; left: 10px; 
            }
            #dashboard, #weather-dashboard {
                max-width: calc(100vw - 60px);
            }
        }
    </style>
</head>
<body>
    <div id="windy"></div>
    
    <div id="dash-container">
        
        <div id="dashboard">
            <div class="dash-header" onclick="document.getElementById('dashboard').classList.toggle('collapsed')">
                <span class="vessel-icon">⛵</span>
                <div>
                    <div class="vessel-name">Exodus</div>
                    <div class="vessel-sub">Live Tracker Dashboard</div>
                </div>
                <div class="dash-collapse-btn">
                    <div class="status-dot" id="status-dot"></div>
                    <i class="dash-chevron">▲</i>
                </div>
            </div>
            
            <div class="dash-body">
                <div class="data-row">
                    <div class="data-label">📍 Coordinates</div>
                    <div class="data-value accent" id="dash-coords">—</div>
                </div>

                <div class="data-grid">
                    <div class="data-row">
                        <div class="data-label">⚡ Speed</div>
                        <div class="data-value" id="dash-speed">—</div>
                    </div>
                    <div class="data-row">
                        <div class="data-label">🧭 Course</div>
                        <div class="data-value" id="dash-course">—</div>
                    </div>
                </div>

                <div class="data-grid">
                    <div class="data-row">
                        <div class="data-label">⬆️ Elevation</div>
                        <div class="data-value" id="dash-elevation">—</div>
                    </div>
                    <div class="data-row">
                        <div class="data-label">📡 GPS</div>
                        <div class="data-value green" id="dash-gps">—</div>
                    </div>
                </div>

                <div class="data-row">
                    <div class="data-label">🕒 Last Update</div>
                    <div class="data-value" id="dash-updated">—</div>
                </div>
            </div>
        </div>

        <div id="weather-dashboard">
            <div class="dash-header">
                <span class="vessel-icon" id="weather-icon">☁️</span>
                <div>
                    <div class="vessel-name" id="weather-label">Exodus Weather</div>
                    <div class="vessel-sub">Live Conditions</div>
                </div>
            </div>
            <div class="weather-grid">
                <div class="data-row">
                    <div class="data-label">💨 Wind</div>
                    <div class="data-value accent" id="wx-wind">—</div>
                </div>
                <div class="data-row">
                    <div class="data-label">🌡️ Temp</div>
                    <div class="data-value" id="wx-temp">—</div>
                </div>
                <div class="data-row">
                    <div class="data-label">🌊 Waves</div>
                    <div class="data-value" id="wx-wave">—</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const options = {
            key: '{{WINDY_KEY}}', 
            verbose: false,
            lat: 39.3, 
            lon: 22.9,
            zoom: 7,
        };

        windyInit(options, windyAPI => {
            const { map } = windyAPI;

            // --- NATIVE WIDGET INTEGRATION ---
            const dashEl = document.getElementById('dash-container');
            if (dashEl) {
                L.DomEvent.disableClickPropagation(dashEl);
                L.DomEvent.disableScrollPropagation(dashEl);
            }
            // ----------------------------------

            // --- WEATHER CONFIGURATION ---
            // Set to true to allow users to click anywhere on the map to check weather.
            const ENABLE_CUSTOM_PINS = true; 
            
            let customPinMarker = null;
            let isViewingCustomPin = false;

            function fetchLocalWeather(lat, lon, isBoat = true) {
                // URL 1: Standard Weather (Wind, Temp) - falls back to GFS if ECMWF is delayed
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m&wind_speed_unit=kn`;
                
                // URL 2: Marine Data (Waves)
                const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height`;

                // Fetch both at the same time safely
                Promise.all([
                    fetch(weatherUrl).then(res => res.ok ? res.json() : null).catch(() => null),
                    fetch(marineUrl).then(res => res.ok ? res.json() : null).catch(() => null)
                ]).then(([weatherData, marineData]) => {
                    
                    // 1. Process Weather Data
                    if (weatherData && weatherData.current) {
                        const wind = weatherData.current.wind_speed_10m;
                        const temp = weatherData.current.temperature_2m;
                        document.getElementById('wx-wind').textContent = wind !== null ? `${wind.toFixed(1)} kn` : '— kn';
                        document.getElementById('wx-temp').textContent = temp !== null ? `${temp.toFixed(1)} °C` : '— °C';
                    }

                    // 2. Process Marine Data
                    if (marineData && marineData.current) {
                        const waves = marineData.current.wave_height;
                        // Wave height is returned in meters
                        document.getElementById('wx-wave').textContent = waves !== null ? `${waves.toFixed(1)} m` : '— m';
                    } else {
                        // Failsafe: If clicked on land, marine API returns nothing. Show dash.
                        document.getElementById('wx-wave').textContent = '— m';
                    }
                    
                    // 3. Update UI Styling
                    if (isBoat) {
                        document.getElementById('weather-label').textContent = "⛵Exodus Weather";
                        document.getElementById('weather-label').style.color = "var(--text-primary)";
                        document.getElementById('weather-icon').textContent = "☁️";
                    } else {
                        document.getElementById('weather-label').textContent = "Pinned Location";
                        document.getElementById('weather-label').style.color = "var(--warning)";
                        document.getElementById('weather-icon').textContent = "📍";
                    }
                });
            }

            // Map Click Listener (The Pin-Drop Feature)
            if (ENABLE_CUSTOM_PINS) {
                map.on('click', function(e) {
                    isViewingCustomPin = true;
                    
                    if (customPinMarker) map.removeLayer(customPinMarker);
                    
                    // Drop a temporary pin
                    customPinMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
                    
                    // Fetch weather for the clicked location
                    fetchLocalWeather(e.latlng.lat, e.latlng.lng, false);
                    
                    // Clicking the pin removes it and resets weather to the boat
                    customPinMarker.on('click', function() {
                        map.removeLayer(customPinMarker);
                        isViewingCustomPin = false;
                        fetchAndUpdateMap(); // Immediately reset to boat data
                    });
                });
            }
            // -----------------------------

            let currentTrackLine = null;
            let currentMarker = null;
            let isFirstLoad = true; 

            // Calculate Data Age efficiently using the pre-formatted GMT section
            function updateDataAge(timeString) {
                let parts = timeString.split(' (');
                if (parts.length === 2) {
                    let datePart = parts[0].substring(0, 16); 
                    let gmtTimePart = parts[1].replace(')', ''); 
                    let cleanUTC = `${datePart} ${gmtTimePart}`; 
                    
                    const pointTime = new Date(cleanUTC).getTime();
                    if (!isNaN(pointTime)) {
                        const now = new Date().getTime();
                        const diffMins = Math.floor((now - pointTime) / 60000);
                        
                        let dotClass = 'status-dot'; 
                        if (diffMins < 60) {
                            dotClass = 'status-dot'; 
                        } else if (diffMins < 1440) {
                            dotClass = 'status-dot stale'; 
                        } else {
                            dotClass = 'status-dot error'; 
                        }
                        document.getElementById('status-dot').className = dotClass;
                        return;
                    }
                }
                document.getElementById('status-dot').className = 'status-dot error';
            }

            function fetchAndUpdateMap() {
                fetch('track.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        // Read from optimized JSON structure object
                        if (data && data.latest && data.history) {
                            const coordinates = data.history;
                            const latestPoint = data.latest;

                            if (currentMarker) map.removeLayer(currentMarker);
                            if (currentTrackLine) map.removeLayer(currentTrackLine);
                            
                            if (coordinates.length > 1) {
                                currentTrackLine = L.polyline(coordinates, {
                                    color: '#ffea00',
                                    weight: 4,
                                    opacity: 1.0,
                                    smoothFactor: 1
                                }).addTo(map);
                            }
                            
                            // On the first load, snap the camera directly to the boat's current location
                            if (isFirstLoad) {
                                map.setView([latestPoint.lat, latestPoint.lon], 4);
                                isFirstLoad = false;
                            }
                            
                            document.getElementById('dash-coords').textContent = `${latestPoint.lat.toFixed(4)}°N, ${Math.abs(latestPoint.lon).toFixed(4)}°${latestPoint.lon < 0 ? 'W' : 'E'}`;
                            
                            // Update boat weather (only if user hasn't dropped a custom pin)
                            if (!isViewingCustomPin) {
                                fetchLocalWeather(latestPoint.lat, latestPoint.lon, true);
                            }

                            // Parse pre-formatted Python speed string without redundant math conversions
                            let rawSpeed = latestPoint.speed || '0.0 kn (0.0 km/h)';
                            let speedParts = rawSpeed.split(' (');
                            let knots = speedParts[0]; 
                            let kmh = speedParts[1] ? speedParts[1].replace(')', '') : ''; 

                            document.getElementById('dash-speed').innerHTML = `
                                <div style="line-height: 1.1;">
                                    <div>${knots}</div>
                                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 400; padding-top: 3px;">${kmh}</div>
                                </div>
                            `;

                            document.getElementById('dash-course').textContent = latestPoint.course || '0';
                            document.getElementById('dash-elevation').textContent = latestPoint.elevation || '—';
                            document.getElementById('dash-gps').textContent = 'Valid Fix'; 
                            
                            // Parse pre-formatted Python time string without constructing heavy date objects
                            let rawTime = latestPoint.time || '';
                            let timeParts = rawTime.split(' (');
                            let localTime = '—';
                            let gmtTime = '—';
                            
                            if (timeParts.length === 2) {
                                // Strips out the seconds cleanly to keep the dashboard professional and scannable
                                localTime = timeParts[0].replace(/:\d{2}(?=\s[A-Z]+)/, ''); 
                                gmtTime = timeParts[1].replace(')', '').replace(/:\d{2}(?=\s[A-Z]+)/, ''); 
                            } else {
                                localTime = rawTime;
                            }

                            document.getElementById('dash-updated').innerHTML = `
                                <div style="line-height: 1.1;">
                                    <div>${localTime}</div>
                                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 400; padding-top: 3px;">${gmtTime}</div>
                                </div>
                            `;
                            
                            updateDataAge(latestPoint.time);
                            
                            let courseAngle = parseFloat(latestPoint.course);
                            if (isNaN(courseAngle)) courseAngle = 0;
                            
                            const arrowHtml = `
                                <div style="transform: rotate(${courseAngle}deg); transform-origin: center; width: 30px; height: 30px;">
                                    <svg class="mobile-scale" viewBox="0 0 100 100" style="width: 100%; height: 100%; overflow: visible;">
                                        <polygon points="50,15 85,85 50,70 15,85" fill="#ff4757" stroke="#ffffff" stroke-width="4"/>
                                    </svg>
                                </div>
                            `;
                            
                            const customArrow = L.divIcon({
                                className: 'boat-arrow-icon',
                                html: arrowHtml,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15]
                            });

                            currentMarker = L.marker([latestPoint.lat, latestPoint.lon], {icon: customArrow}).addTo(map);
                        }
                    })
                    .catch(err => console.error("Error loading track data:", err));
            }

            fetchAndUpdateMap();

            setInterval(fetchAndUpdateMap, 30000);
            
            setInterval(() => {
                fetch('track.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.latest) {
                            updateDataAge(data.latest.time);
                        }
                    });
            }, 30000);

            // Instantly update the map the moment the user switches back to this tab
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    console.log("Tab active: Fetching fresh tracking data...");
                    fetchAndUpdateMap();
                }
            });
            
        });
    </script>
</body>
</html>
