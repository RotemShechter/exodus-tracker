<!DOCTYPE html>
<html>
<head>
    <title>Exodus Live Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; /* Physically disables any ability to scroll or bounce */
            overscroll-behavior: none; /* Stops the "pull-to-refresh" rubber-band effect */
        }
        
        #windy { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            width: 100%; 
            height: 100%;
        }
        
        .leaflet-popup-content-wrapper {
            /* If the black text is too hard to read, change #1a1c23 to #ffffff (white) */
            background-color: #1a1c23; 
            color: #9ba3af;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 2px;
        }
        .leaflet-popup-tip {
            background-color: #1a1c23; /* Match this to the wrapper background */
        }
        .custom-popup {
            padding: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .custom-popup h3 {
            color: #58a6ff;
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 600;
        }
        .custom-popup .row {
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
        }
        .custom-popup .icon {
            margin-right: 8px;
            font-size: 16px;
        }
        
        /* IMPROVEMENT 1: Parameters black and bold */
        .custom-popup strong {
            color: #000000;
            font-weight: 900; 
        }
        
        .custom-popup .green-text {
            color: #3fb950;
        }

/* Removes the default white square background Leaflet puts on custom div icons */
        .leaflet-div-icon {
            background: transparent;
            border: none;
        }

        /* ADD THIS ENTIRE BLOCK: Mobile-specific adjustments */
        @media (max-width: 600px) {
            .custom-popup {
                font-size: 16px; /* Larger base text */
                padding: 12px;   /* More breathing room */
            }
            .custom-popup h3 {
                font-size: 22px; /* Larger title */
            }
            .custom-popup .icon {
                font-size: 18px; /* Larger emojis/icons */
            }
            /* Scales up the directional arrow container by 30% on mobile */
            .mobile-scale { 
                transform: scale(1.3); 
                transform-origin: center;
            }
        }
    </style>
</head>
<body>
    <div id="windy"></div>
    
    <script>
        const options = {
            key: '{{WINDY_KEY}}', 
            verbose: false,
            lat: 39.3, 
            lon: 22.9,
            zoom: 7,
        };

        windyInit(options, windyAPI => {
            const { map } = windyAPI;

            // Variables to hold our map layers so we can delete the old ones before drawing new ones
            let currentTrackLine = null;
            let currentMarker = null;
            let isFirstLoad = true; 

            // We wrap the fetching logic in a function so we can call it repeatedly
            function fetchAndUpdateMap() {
                fetch('track.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const coordinates = data.map(point => [point.lat, point.lon]);
                            const latestPoint = data[data.length - 1];

                            // 1. Clean up old graphics from the map
                            if (currentTrackLine) map.removeLayer(currentTrackLine);
                            if (currentMarker) map.removeLayer(currentMarker);
                            
                            // 2. Draw the new line
                            if (coordinates.length > 1) {
                                currentTrackLine = L.polyline(coordinates, {
                                    color: '#ffea00',
                                    weight: 4,
                                    opacity: 1.0,
                                    smoothFactor: 1
                                }).addTo(map);

                                // Only lock the camera to the boat the VERY FIRST time the page loads
                                if (isFirstLoad) {
                                    map.fitBounds(currentTrackLine.getBounds(), { maxZoom: 12, padding: [50, 50] });
                                    isFirstLoad = false;
                                }
                            } else if (isFirstLoad) {
                                map.setView(coordinates[0], 10);
                                isFirstLoad = false;
                            }
                            
                            // 3. Prepare the clean Popup
                            const popupHTML = `
                                <div class="custom-popup">
                                    <h3>⛵ Exodus</h3>
                                    <div class="row"><span class="icon">📍</span> <span><strong>Coords:</strong> ${latestPoint.lat.toFixed(4)}°N, ${Math.abs(latestPoint.lon).toFixed(4)}°${latestPoint.lon < 0 ? 'W' : 'E'}</span></div>
                                    <div class="row"><span class="icon">⚡</span> <span><strong>Speed:</strong> ${latestPoint.speed}</span></div>
                                    <div class="row"><span class="icon">🧭</span> <span><strong>Course:</strong> ${latestPoint.course}</span></div>
                                    <div class="row"><span class="icon">⬆️</span> <span><strong>Elevation:</strong> ${latestPoint.elevation}</span></div>
                                    <div class="row"><span class="icon">📡</span> <span><strong>GPS:</strong> <span class="green-text">Valid Fix</span></span></div>
                                    <div class="row"><span class="icon">🕒</span> <span><strong>Updated:</strong> ${latestPoint.time}</span></div>
                                </div>
                            `;

                            // 4. Prepare the new Arrow
                            let courseAngle = parseFloat(latestPoint.course);
                            if (isNaN(courseAngle)) courseAngle = 0;
                            
                            const arrowHtml = `
                                <div style="transform: rotate(${courseAngle}deg); transform-origin: center; width: 30px; height: 30px;">
                                    <svg class="mobile-scale" viewBox="0 0 100 100" style="width: 100%; height: 100%; overflow: visible;">
                                        <polygon points="50,15 85,85 50,70 15,85" fill="#ff4757" stroke="#ffffff" stroke-width="4"/>
                                    </svg>
                                </div>
                            `;
                            
                            const customArrow = L.divIcon({
                                className: 'boat-arrow-icon',
                                html: arrowHtml,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15],  
                                popupAnchor: [0, -20]  
                            });

                            // 5. Draw the new Marker on the map
                            currentMarker = L.marker([latestPoint.lat, latestPoint.lon], {icon: customArrow})
                                .addTo(map)
                                .bindPopup(popupHTML, { minWidth: 280 })
                                .openPopup();
                        }
                    })
                    .catch(err => console.error("Error loading track data:", err));
            }

            // Execute the initial radar sweep as soon as the page loads
            fetchAndUpdateMap();

            // Set the timer: run the sweep again every 0.5 minutes (30,000 milliseconds)
            setInterval(fetchAndUpdateMap, 30000);
        });
    </script>
</body>
</html>
