<!DOCTYPE html>
<html>
<head>
    <title>Exodus Live Tracking</title>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #windy { width: 100vw; height: 100vh; }
        
        .leaflet-popup-content-wrapper {
            /* If the black text is too hard to read, change #1a1c23 to #ffffff (white) */
            background-color: #1a1c23; 
            color: #9ba3af;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 2px;
        }
        .leaflet-popup-tip {
            background-color: #1a1c23; /* Match this to the wrapper background */
        }
        .custom-popup {
            padding: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .custom-popup h3 {
            color: #58a6ff;
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 600;
        }
        .custom-popup .row {
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
        }
        .custom-popup .icon {
            margin-right: 8px;
            font-size: 16px;
        }
        
        /* IMPROVEMENT 1: Parameters black and bold */
        .custom-popup strong {
            color: #000000;
            font-weight: 900; 
        }
        
        .custom-popup .green-text {
            color: #3fb950;
        }

        /* Removes the default white square background Leaflet puts on custom div icons */
        .leaflet-div-icon {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
    <div id="windy"></div>
    
    <script>
        const options = {
            key: '{{WINDY_KEY}}', 
            verbose: false,
            lat: 39.3, 
            lon: 22.9,
            zoom: 7,
        };

        windyInit(options, windyAPI => {
            const { map } = windyAPI;

            fetch('track.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        
                        const coordinates = data.map(point => [point.lat, point.lon]);
                        
                        const trackLine = L.polyline(coordinates, {
                            color: '#ffffff',
                            weight: 3,
                            opacity: 0.9,
                            smoothFactor: 1
                        }).addTo(map);

                        map.fitBounds(trackLine.getBounds());
                        
                        const latestPoint = data[data.length - 1];
                        
                        // IMPROVEMENT 4: Removed "from MSL" string below
                        const popupHTML = `
                            <div class="custom-popup">
                                <h3>⛵ Exodus</h3>
                                <div class="row"><span class="icon">📍</span> <span><strong>Coords:</strong> ${latestPoint.lat.toFixed(4)}°N, ${Math.abs(latestPoint.lon).toFixed(4)}°${latestPoint.lon < 0 ? 'W' : 'E'}</span></div>
                                <div class="row"><span class="icon">⚡</span> <span><strong>Speed:</strong> ${latestPoint.speed}</span></div>
                                <div class="row"><span class="icon">🧭</span> <span><strong>Course:</strong> ${latestPoint.course}</span></div>
                                <div class="row"><span class="icon">⬆️</span> <span><strong>Elevation:</strong> ${latestPoint.elevation}</span></div>
                                <div class="row"><span class="icon">📡</span> <span><strong>GPS:</strong> <span class="green-text">Valid Fix</span></span></div>
                                <div class="row"><span class="icon">🕒</span> <span><strong>Updated:</strong> ${latestPoint.time}</span></div>
                                <div class="row"><span class="icon">📝</span> <span><strong>Event:</strong> ${latestPoint.event}</span></div>
                            </div>
                        `;

                        // IMPROVEMENT 3: Add directional arrow marker
                        // JavaScript's parseFloat neatly extracts the number "45" from Garmin's "45° NE"
                        const courseAngle = parseFloat(latestPoint.course) || 0;
                        
                        // Create a custom SVG icon that rotates according to courseAngle
                        const arrowHtml = `
                            <div style="transform: rotate(${courseAngle}deg); transform-origin: center; width: 30px; height: 30px;">
                                <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5));">
                                    <polygon points="50,15 85,85 50,70 15,85" fill="#ff4757" stroke="#ffffff" stroke-width="4"/>
                                </svg>
                            </div>
                        `;
                        
                        const customArrow = L.divIcon({
                            className: 'boat-arrow-icon',
                            html: arrowHtml,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15],  // Centers the icon right on the coordinate
                            popupAnchor: [0, -15]  // Pushes the popup slightly above the arrow
                        });

                        L.marker([latestPoint.lat, latestPoint.lon], {icon: customArrow}).addTo(map)
                            .bindPopup(popupHTML, { minWidth: 280 })
                            .openPopup();
                    }
                })
                .catch(err => console.error("Error loading track data:", err));
        });
    </script>
</body>
</html>
